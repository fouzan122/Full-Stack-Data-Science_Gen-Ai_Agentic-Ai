<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right,#4facfe,#00f2fe);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            margin:0;
            padding: 20px;
        }

        .container{
            background:#fff;
            padding:30px;
            border-radius:15px;
            width:400px;
            box-shadow:0px 5px 15px rgba(0,0,0,0.3);
        }

        h2{
            text-align:center;
            color:#333;
            margin-bottom:5px;
        }

        .note{
            text-align:center;
            color:#888;
            font-size:12px;
            margin-bottom:20px;
        }

        label{
            font-weight:bold;
            display:block;
            margin-top:10px;
            color:#333;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:14px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        .result{
            margin-top:20px;
            text-align:center;
            font-size:20px;
            color:green;
            font-weight:bold;
            min-height: 28px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🏠 House Price Prediction</h2>
    <p class="note">Estimate based on lot size, bedrooms &amp; bathrooms</p>

    <form id="predictForm">

        <label>Lot Size (sq.ft)</label>
        <input type="number" id="lot" name="lot" placeholder="e.g. 7500" min="0" required>

        <label>Bedrooms</label>
        <input type="number" id="bedrooms" name="bedrooms" placeholder="e.g. 3" min="0" required>

        <label>Bathrooms</label>
        <input type="number" id="bathrooms" name="bathrooms" placeholder="e.g. 2" min="0" step="0.25" required>

        <button type="submit">Predict Price</button>

    </form>

    <!-- Prediction Result -->
    <div class="result" id="result"></div>

</div>

<script>
    // Coefficients extracted directly from the trained model (model.pkl):
    // LinearRegression, feature order: [sqft_lot, bedrooms, bathrooms]
    const COEF = {
        intercept: -41578.64199000562,
        lot: 0.401988415,
        bed: 22562.5663,
        bath: 237108.246
    };

    const form = document.getElementById('predictForm');
    const result = document.getElementById('result');

    form.addEventListener('submit', function(e){
        e.preventDefault();

        const lot = Number(document.getElementById('lot').value);
        const bed = Number(document.getElementById('bedrooms').value);
        const bath = Number(document.getElementById('bathrooms').value);

        const prediction = COEF.intercept + (COEF.lot * lot) + (COEF.bed * bed) + (COEF.bath * bath);
        const price = Math.max(prediction, 0);

        result.textContent = '₹ ' + price.toLocaleString('en-IN', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
    });
</script>

</body>
</html>
